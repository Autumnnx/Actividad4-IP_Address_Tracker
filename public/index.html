<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search an IP address or domain and view its geographic information.">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>IP Address Tracker</title>

  <!-- Leaflet provides the interactive map used by the application. -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >
  <link rel="stylesheet" href="./css/style.css">
</head> 
<body>
  <!-- Header contains the original Frontend Mentor background, title and search. -->
  <header class="hero">
    <div class="hero__inner">
      <h1>IP Address Tracker</h1>

      <form class="search-form" id="search-form" novalidate>
        <label class="sr-only" for="search-input">Search for any IP address or domain</label>
        <input
          id="search-input"
          name="query"
          type="text"
          placeholder="Search for any IP address or domain"
          autocomplete="off"
        >
        <button type="submit" aria-label="Search">
          <img src="./images/icon-arrow.svg" alt="">
        </button>
      </form>

      <p class="search-message" id="search-message" aria-live="polite"></p>

      <!-- This card intentionally overlaps the header and the map, as in the design. -->
      <section class="info-card" aria-label="IP address information">
        <article class="info-card__item">
          <h2>IP ADDRESS</h2>
          <p id="ip-value">192.212.174.101</p>
        </article>

        <article class="info-card__item">
          <h2>LOCATION</h2>
          <p id="location-value">Brooklyn, NY<br class="location-break">10001</p>
        </article>

        <article class="info-card__item">
          <h2>TIMEZONE</h2>
          <p id="timezone-value">UTC -05:00</p>
        </article>

        <article class="info-card__item">
          <h2>ISP</h2>
          <p id="isp-value">SpaceX Starlink</p>
        </article>
      </section>
    </div>
  </header>

  <!-- Leaflet renders the interactive map inside this container. -->
  <main>
    <div id="map" class="map" aria-label="Map showing the location of the IP address"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
